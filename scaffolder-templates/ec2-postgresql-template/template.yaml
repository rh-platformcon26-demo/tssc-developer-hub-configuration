apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ec2-postgresql-template
  title: Provision AWS EC2 with PostgreSQL (Ansible + Tekton)
  description: >
    Publish a GitOps repository and create an Argo CD Application that syncs a
    Tekton PipelineRun. The pipeline clones the ansible repository and runs
    ec2-postgresql to provision a Fedora EC2 instance with PostgreSQL
    (localhost only, access via SSH tunnel).
  tags:
    - aws
    - ansible
    - postgresql
    - tekton
    - infrastructure
    - ec2
    - gitops
spec:
  owner: tssc
  type: infrastructure
  parameters:
    - title: Instance
      required:
        - instanceName
        - vpcId
        - subnetId
        - keyName
        - postgresPassword
        - namespace
        - repoOwner
      properties:
        instanceName:
          title: Instance Name
          type: string
          description: EC2 Name tag and Ansible instance_name (also used in GitLab repo name)
          default: ansible-fedora-postgres
          ui:autofocus: true
          maxLength: 48
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
        vpcId:
          title: VPC ID
          type: string
          description: Existing AWS VPC (e.g. vpc-xxxxxxxx)
        subnetId:
          title: Subnet ID
          type: string
          description: Existing subnet (prefer public for SSH)
        keyName:
          title: EC2 Key Pair Name
          type: string
          description: Existing EC2 key pair name (must match SSH secret)
        namespace:
          title: CI Namespace
          type: string
          description: Namespace where Argo syncs the PipelineRun (Secrets must exist here)
          default: tssc-app-ci
        repoOwner:
          title: GitLab Repo Owner
          type: string
          description: GitLab group/user that will own the GitOps repository
          default: development
        postgresPassword:
          title: PostgreSQL Password
          type: string
          description: Password for the application database user
          ui:field: Secret
          ui:widget: password
    - title: Optional Settings
      properties:
        awsRegion:
          title: AWS Region
          type: string
          default: eu-west-3
        instanceType:
          title: Instance Type
          type: string
          default: t3.medium
        postgresDb:
          title: PostgreSQL Database
          type: string
          default: appdb
        postgresUser:
          title: PostgreSQL User
          type: string
          default: appuser
        sshIngressCidr:
          title: SSH Ingress CIDR
          type: string
          default: 0.0.0.0/0
        awsSecret:
          title: AWS Credentials Secret
          type: string
          description: Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
          default: aws-credentials
        sshSecret:
          title: SSH Key Secret
          type: string
          description: Secret with key ssh-privatekey (PEM)
          default: ec2-ssh-key
        ansibleGitRevision:
          title: Ansible Git Revision
          type: string
          default: main

  steps:
    - id: fetch-provision-data
      name: Fetch Provision Data
      action: catalog:fetch
      input:
        entityRef: component:default/provisioning-data

    - id: fetch-gitops-skeleton
      name: Generate GitOps Manifests
      action: fetch:template
      input:
        url: ./gitops-template
        values:
          instanceName: ${{ parameters.instanceName }}
          namespace: ${{ parameters.namespace }}
          vpcId: ${{ parameters.vpcId }}
          subnetId: ${{ parameters.subnetId }}
          keyName: ${{ parameters.keyName }}
          awsRegion: ${{ parameters.awsRegion }}
          instanceType: ${{ parameters.instanceType }}
          sshIngressCidr: ${{ parameters.sshIngressCidr }}
          postgresDb: ${{ parameters.postgresDb }}
          postgresUser: ${{ parameters.postgresUser }}
          postgresPassword: ${{ parameters.postgresPassword }}
          awsSecret: ${{ parameters.awsSecret }}
          sshSecret: ${{ parameters.sshSecret }}
          ansibleGitRevision: ${{ parameters.ansibleGitRevision }}
          ansibleGitUrl: 'https://gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}/rhdh/ansible.git'
          repoURL: 'https://gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}/${{ parameters.repoOwner }}/${{ parameters.instanceName }}-ec2-pg-gitops'
          argoNS: tssc-gitops
          argoProject: default
          defaultBranch: master
          owner: user:default/${{ user.entity.metadata.name }}

    - id: publish-gitlab-gitops
      name: Publish GitOps Repository to GitLab
      action: publish:gitlab
      input:
        repoUrl: 'gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.instanceName }}-ec2-pg-gitops'
        defaultBranch: master
        repoVisibility: public

    - id: create-argocd-resources
      name: Create Argo CD Resources
      action: argocd:create-resources
      input:
        appName: ${{ parameters.instanceName }}-ec2-pg-app-of-apps
        argoInstance: default
        namespace: tssc-gitops
        repoUrl: https://gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}/${{ parameters.repoOwner }}/${{ parameters.instanceName }}-ec2-pg-gitops.git
        path: './app-of-apps'

    - id: register-gitops
      name: Register GitOps in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab-gitops'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: GitOps Repository
        url: ${{ steps['publish-gitlab-gitops'].output.remoteUrl }}
      - title: Open GitOps Resource in catalog
        icon: catalog
        entityRef: ${{ steps['register-gitops'].output.entityRef }}
    text:
      - title: Next steps
        content: |
          Argo CD will sync PipelineRun `ec2-postgresql-${{ parameters.instanceName }}`
          into namespace **${{ parameters.namespace }}**.

          Prerequisites in that namespace:
          - Secret `${{ parameters.awsSecret }}` with keys `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`
          - Secret `${{ parameters.sshSecret }}` with key `ssh-privatekey`
          - Pipeline `ec2-postgresql` and Task `ansible-ec2-postgresql` installed

          Watch progress:
          ```
          oc get pipelinerun -n ${{ parameters.namespace }} ec2-postgresql-${{ parameters.instanceName }}
          oc get application -n tssc-gitops ${{ parameters.instanceName }}-ec2-pg
          ```

          After success, SSH-tunnel to PostgreSQL:
          ```
          ssh -i <key.pem> -L 5432:127.0.0.1:5432 fedora@<ec2_ip>
          psql -h 127.0.0.1 -p 5432 -U ${{ parameters.postgresUser }} -d ${{ parameters.postgresDb }}
          ```
