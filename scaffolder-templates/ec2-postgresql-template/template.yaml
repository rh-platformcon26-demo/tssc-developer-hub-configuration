apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ec2-postgresql-template
  title: Provision AWS EC2 with PostgreSQL (Ansible + Tekton)
  description: >
    Create a source repository with Pipelines-as-Code and a GitOps repository
    that wires the PaC Repository + GitLab webhook. A push to master runs the
    ec2-postgresql Tekton pipeline (Ansible) to provision a Fedora EC2 instance
    with PostgreSQL (localhost only, access via SSH tunnel).
  tags:
    - aws
    - ansible
    - postgresql
    - tekton
    - infrastructure
    - ec2
    - gitops
spec:
  owner: tssc
  type: infrastructure
  parameters:
    - title: Instance
      required:
        - instanceName
        - vpcId
        - subnetId
        - keyName
        - repoOwner
      properties:
        instanceName:
          title: Name
          type: string
          description: Unique name (EC2 Name tag, GitLab repos, catalog entities)
          default: ec2-postgres
          ui:field: EntityNamePicker
          ui:autofocus: true
          maxLength: 48
        vpcId:
          title: VPC ID
          type: string
          description: Existing AWS VPC (e.g. vpc-xxxxxxxx)
        subnetId:
          title: Subnet ID
          type: string
          description: Existing subnet ID (e.g. subnet-0abc...), not the Name tag
        keyName:
          title: EC2 Key Pair Name
          type: string
          description: Existing EC2 key pair name (must match SSH secret)
          default: ansible
        repoOwner:
          title: GitLab Repo Owner
          type: string
          description: GitLab group/user that will own the source and GitOps repositories
          default: development
        postgresPassword:
          title: PostgreSQL Password
          type: string
          description: Password for the application database user (collected as a scaffolder secret)
          ui:field: Secret
    - title: Optional Settings
      properties:
        awsRegion:
          title: AWS Region
          type: string
          default: eu-west-3
        instanceType:
          title: Instance Type
          type: string
          default: t3.medium
        postgresDb:
          title: PostgreSQL Database
          type: string
          default: appdb
        postgresUser:
          title: PostgreSQL User
          type: string
          default: appuser
        sshIngressCidr:
          title: SSH Ingress CIDR
          type: string
          default: 0.0.0.0/0
        awsSecret:
          title: AWS Credentials Secret
          type: string
          description: Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (in tssc-app-ci)
          default: aws-credentials
        sshSecret:
          title: SSH Key Secret
          type: string
          description: Secret with key ssh-privatekey (PEM) (in tssc-app-ci)
          default: ec2-ssh-key
        ansibleGitRevision:
          title: Ansible Git Revision
          type: string
          default: main

  steps:
    - id: fetch-provision-data
      name: Fetch Provision Data
      action: catalog:fetch
      input:
        entityRef: component:default/provisioning-data

    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.instanceName }}
          namespace: tssc-app
          owner: user:default/${{ user.entity.metadata.name }}
          gitlabHost: gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}
          destination: ${{ parameters.repoOwner }}/${{ parameters.instanceName }}
          vpcId: ${{ parameters.vpcId }}
          subnetId: ${{ parameters.subnetId }}
          keyName: ${{ parameters.keyName }}
          awsRegion: ${{ parameters.awsRegion }}
          instanceType: ${{ parameters.instanceType }}
          sshIngressCidr: ${{ parameters.sshIngressCidr }}
          postgresDb: ${{ parameters.postgresDb }}
          postgresUser: ${{ parameters.postgresUser }}
          postgresPassword: ${{ secrets.postgresPassword }}
          awsSecret: ${{ parameters.awsSecret }}
          sshSecret: ${{ parameters.sshSecret }}
          ansibleGitRevision: ${{ parameters.ansibleGitRevision }}
          ansibleGitUrl: 'https://github.com/rh-platformcon26-demo/ansible.git'

    - id: publish-gitlab-source
      name: Publish Source Repository
      action: publish:gitlab
      input:
        repoUrl: 'gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.instanceName }}'
        defaultBranch: master
        repoVisibility: public

    - id: fetch-gitops-skeleton
      name: Fetch GitOps Skeleton
      action: fetch:template
      input:
        url: ./gitops-template
        targetPath: gitops
        values:
          name: ${{ parameters.instanceName }}
          appName: ${{ parameters.instanceName }}-gitops
          description: GitOps / Pipelines-as-Code wiring for ${{ parameters.instanceName }}
          namespace: tssc-app
          repoURL: 'https://gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}/${{ parameters.repoOwner }}/${{ parameters.instanceName }}-gitops'
          srcRepoURL: 'https://gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}/${{ parameters.repoOwner }}/${{ parameters.instanceName }}'
          argoComponentOverlays: './components/${{ parameters.instanceName }}/overlays'
          owner: user:default/${{ user.entity.metadata.name }}
          argoNS: tssc-gitops
          argoProject: default
          gitlabHost: gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}
          gitWebhookSecret: openshift
          defaultBranch: master

    - action: fs:rename
      id: renameComponentDir
      name: Rename Component Directory
      input:
        files:
          - from: gitops/components/infra
            to: gitops/components/${{ parameters.instanceName }}
            overwrite: true

    - id: publish-gitlab-gitops
      name: Publish GitOps Repository to GitLab
      action: publish:gitlab
      input:
        sourcePath: gitops
        repoUrl: 'gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.instanceName }}-gitops'
        defaultBranch: master
        repoVisibility: public

    - id: create-argocd-resources
      name: Create Argo CD Resources
      action: argocd:create-resources
      input:
        appName: ${{ parameters.instanceName }}-app-of-apps
        argoInstance: default
        namespace: tssc-gitops
        repoUrl: https://gitlab-gitlab.${{ steps["fetch-provision-data"].output.entity.metadata.labels["ocp-apps-domain"] }}/${{ parameters.repoOwner }}/${{ parameters.instanceName }}-gitops.git
        path: './app-of-apps'

    - id: register-source
      name: Register Source
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab-source'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: register-gitops
      name: Register GitOps
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab-gitops'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-gitlab-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitlab-gitops'].output.remoteUrl }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: ${{ steps['register-source'].output.entityRef }}
      - title: Open GitOps Resource in catalog
        icon: catalog
        entityRef: ${{ steps['register-gitops'].output.entityRef }}
    text:
      - title: Next steps
        content: |
          Same flow as other TSSC templates (Pipelines-as-Code):

          1. Argo CD syncs the PaC `Repository` + webhook Job into **tssc-app-ci**
          2. The Job registers the GitLab webhook and pushes a dummy commit
          3. PaC creates PipelineRun from `.tekton/` (local Pipeline + Task)

          Prerequisites in **tssc-app-ci**:
          - Secret `${{ parameters.awsSecret }}` (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`)
          - Secret `${{ parameters.sshSecret }}` (`ssh-privatekey`)
          - Secret `gitlab-auth-secret` (already present in TSSC labs)

          Watch progress:
          ```
          oc get repository,job,pipelinerun -n tssc-app-ci -l janus-idp.io/tekton=${{ parameters.instanceName }}
          oc get application -n tssc-gitops ${{ parameters.instanceName }}-ci
          ```

          After success, SSH-tunnel to PostgreSQL:
          ```
          ssh -i <key.pem> -L 5432:127.0.0.1:5432 fedora@<ec2_ip>
          psql -h 127.0.0.1 -p 5432 -U ${{ parameters.postgresUser }} -d ${{ parameters.postgresDb }}
          ```
