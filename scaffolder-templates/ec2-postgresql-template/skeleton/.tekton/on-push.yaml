apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ec2-postgresql-provision
  annotations:
    # Ignore catalog-only commits that update the EC2 IP ([skip ci] in message).
    pipelinesascode.tekton.dev/on-cel-expression: |
      body.object_kind == "push" && body.ref == "refs/heads/master" &&
      !(has(body.commits) && body.commits.exists(c, c.message.contains("[skip ci]")))
  labels:
    backstage.io/kubernetes-id: "${{ values.name }}"
    janus-idp.io/tekton: "${{ values.name }}"
    app.kubernetes.io/part-of: platformcon-wescale
    ec2-postgresql/instance: "${{ values.name }}"
spec:
  params:
    - name: ANSIBLE_GIT_URL
      value: "${{ values.ansibleGitUrl }}"
    - name: ANSIBLE_GIT_REVISION
      value: "${{ values.ansibleGitRevision }}"
    - name: SOURCE_REPO_URL
      value: "https://${{ values.gitlabHost }}/${{ values.destination }}"
    - name: AWS_REGION
      value: "${{ values.awsRegion }}"
    - name: VPC_ID
      value: "${{ values.vpcId }}"
    - name: SUBNET_ID
      value: "${{ values.subnetId }}"
    - name: KEY_NAME
      value: "${{ values.keyName }}"
    - name: INSTANCE_NAME
      value: "${{ values.name }}"
    - name: INSTANCE_TYPE
      value: "${{ values.instanceType }}"
    - name: SSH_INGRESS_CIDR
      value: "${{ values.sshIngressCidr }}"
    - name: POSTGRES_DB
      value: "${{ values.postgresDb }}"
    - name: POSTGRES_USER
      value: "${{ values.postgresUser }}"
    - name: POSTGRES_PASSWORD
      value: "${{ values.postgresPassword }}"
    - name: AWS_SECRET
      value: "${{ values.awsSecret }}"
    - name: SSH_SECRET
      value: "${{ values.sshSecret }}"
  pipelineRef:
    name: ec2-postgresql
