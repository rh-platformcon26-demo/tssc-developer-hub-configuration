apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ansible-ec2-postgresql
  labels:
    app.kubernetes.io/part-of: platformcon-wescale
  annotations:
    description: |
      Clones the ansible repository and runs the ec2-postgresql playbook
      to provision a Fedora EC2 instance with PostgreSQL (localhost only).

      Cluster prerequisites (same namespace as the PipelineRun):
      - Secret aws-credentials with keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      - Secret ec2-ssh-key with key ssh-privatekey (PEM for the EC2 key pair)
spec:
  description: >
    Provision an AWS Fedora EC2 VM and install PostgreSQL via the
    ansible/ec2-postgresql playbook.
  params:
    - name: ANSIBLE_GIT_URL
      type: string
      description: Git URL of the ansible repository
    - name: ANSIBLE_GIT_REVISION
      type: string
      default: main
      description: Git revision (branch, tag, or commit)
    - name: AWS_REGION
      type: string
      default: eu-west-3
    - name: VPC_ID
      type: string
      description: Existing VPC ID
    - name: SUBNET_ID
      type: string
      description: Existing subnet ID
    - name: KEY_NAME
      type: string
      description: Existing EC2 key pair name
    - name: INSTANCE_NAME
      type: string
      default: ansible-fedora-postgres
    - name: INSTANCE_TYPE
      type: string
      default: t3.medium
    - name: SSH_INGRESS_CIDR
      type: string
      default: 0.0.0.0/0
    - name: POSTGRES_DB
      type: string
      default: appdb
    - name: POSTGRES_USER
      type: string
      default: appuser
    - name: POSTGRES_PASSWORD
      type: string
      description: Application database password
    - name: AWS_SECRET
      type: string
      default: aws-credentials
      description: Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
    - name: SSH_SECRET
      type: string
      default: ec2-ssh-key
      description: Secret with key ssh-privatekey
    - name: ANSIBLE_IMAGE
      type: string
      default: quay.io/agnosticd/ee-multicloud:latest
      description: Ansible execution environment image
  results:
    - name: status
      description: Succeeded or Failed
  volumes:
    - name: ssh-key
      secret:
        secretName: $(params.SSH_SECRET)
        items:
          - key: ssh-privatekey
            path: ssh-privatekey
            mode: 0400
  steps:
    - name: provision
      image: $(params.ANSIBLE_IMAGE)
      workingDir: /workspace
      env:
        - name: HOME
          value: /tmp
        - name: ANSIBLE_GIT_URL
          value: $(params.ANSIBLE_GIT_URL)
        - name: ANSIBLE_GIT_REVISION
          value: $(params.ANSIBLE_GIT_REVISION)
        - name: AWS_REGION
          value: $(params.AWS_REGION)
        - name: VPC_ID
          value: $(params.VPC_ID)
        - name: SUBNET_ID
          value: $(params.SUBNET_ID)
        - name: KEY_NAME
          value: $(params.KEY_NAME)
        - name: INSTANCE_NAME
          value: $(params.INSTANCE_NAME)
        - name: INSTANCE_TYPE
          value: $(params.INSTANCE_TYPE)
        - name: SSH_INGRESS_CIDR
          value: $(params.SSH_INGRESS_CIDR)
        - name: POSTGRES_DB
          value: $(params.POSTGRES_DB)
        - name: POSTGRES_USER
          value: $(params.POSTGRES_USER)
        - name: POSTGRES_PASSWORD
          value: $(params.POSTGRES_PASSWORD)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.AWS_SECRET)
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.AWS_SECRET)
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: $(params.AWS_REGION)
        - name: STATUS_PATH
          value: $(results.status.path)
      volumeMounts:
        - name: ssh-key
          mountPath: /var/run/secrets/ssh
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # OpenShift arbitrary UID: OpenSSH needs a passwd entry; many images
        # keep /etc/passwd read-only. Prefer nss_wrapper, then passwd append.
        # The playbook also uses ansible_connection=paramiko for the EC2 host.
        export HOME=/tmp
        export USER="${USER:-ansible}"
        uid="$(id -u)"
        gid="$(id -g)"
        mkdir -p "${HOME}/.ssh" /tmp/.ansible/tmp
        chmod 700 "${HOME}/.ssh"

        passwd_file="${HOME}/passwd"
        group_file="${HOME}/group"
        echo "${USER}:x:${uid}:${gid}:Ansible:${HOME}:/bin/bash" > "${passwd_file}"
        echo "${USER}:x:${gid}:" > "${group_file}"

        nss_lib=""
        for candidate in \
          /usr/lib64/libnss_wrapper.so \
          /usr/lib64/libnss_wrapper.so.0 \
          /usr/lib/libnss_wrapper.so \
          /usr/lib/libnss_wrapper.so.0; do
          if [[ -f "${candidate}" ]]; then
            nss_lib="${candidate}"
            break
          fi
        done

        if [[ -n "${nss_lib}" ]]; then
          export LD_PRELOAD="${nss_lib}${LD_PRELOAD:+:${LD_PRELOAD}}"
          export NSS_WRAPPER_PASSWD="${passwd_file}"
          export NSS_WRAPPER_GROUP="${group_file}"
          echo "Identity: nss_wrapper (${nss_lib}) for uid ${uid}"
        elif [[ -w /etc/passwd ]] && ! getent passwd "${uid}" >/dev/null 2>&1; then
          cat "${passwd_file}" >> /etc/passwd
          echo "Identity: appended uid ${uid} to /etc/passwd"
        else
          echo "Identity: no nss_wrapper and cannot write /etc/passwd (uid ${uid}); relying on paramiko"
        fi

        export ANSIBLE_LOCAL_TMP=/tmp/.ansible/tmp
        export ANSIBLE_REMOTE_TMP=/tmp
        export ANSIBLE_HOST_KEY_CHECKING=False

        ssh_key_src="/var/run/secrets/ssh/ssh-privatekey"
        ssh_key="/tmp/ec2-ssh-key.pem"
        ansible_dir="/tmp/ansible"

        if [[ ! -f "${ssh_key_src}" ]]; then
          echo "SSH private key not found at ${ssh_key_src}" >&2
          echo -n "Failed" > "${STATUS_PATH}"
          exit 1
        fi
        cp "${ssh_key_src}" "${ssh_key}"
        chmod 600 "${ssh_key}"

        # Paramiko avoids the OpenSSH client UID/passwd issue entirely.
        if ! python3 -c "import paramiko" >/dev/null 2>&1; then
          echo "Installing paramiko for Ansible SSH from arbitrary UID"
          pip3 install --user --disable-pip-version-check paramiko
          user_site="$(python3 -c 'import site; print(site.getusersitepackages())')"
          export PATH="${HOME}/.local/bin:${PATH}"
          export PYTHONPATH="${user_site}${PYTHONPATH:+:${PYTHONPATH}}"
        fi
        python3 -c "import paramiko; print('paramiko', paramiko.__version__)"

        echo "Cloning ${ANSIBLE_GIT_URL} (${ANSIBLE_GIT_REVISION})"
        rm -rf "${ansible_dir}"
        git clone --depth 1 --branch "${ANSIBLE_GIT_REVISION}" \
          "${ANSIBLE_GIT_URL}" "${ansible_dir}"

        playbook_dir="${ansible_dir}/ec2-postgresql"
        if [[ ! -d "${playbook_dir}" ]]; then
          echo "Playbook directory not found: ${playbook_dir}" >&2
          ls -la "${ansible_dir}" >&2 || true
          echo -n "Failed" > "${STATUS_PATH}"
          exit 1
        fi

        cd "${playbook_dir}"
        echo "Installing Ansible collections"
        ansible-galaxy collection install -r requirements.yml

        echo "Running ec2-postgresql playbook for instance ${INSTANCE_NAME}"
        set +e
        ansible-playbook playbooks/site.yml \
          -e "aws_region=${AWS_REGION}" \
          -e "vpc_id=${VPC_ID}" \
          -e "subnet_id=${SUBNET_ID}" \
          -e "key_name=${KEY_NAME}" \
          -e "ansible_ssh_private_key_file=${ssh_key}" \
          -e "instance_name=${INSTANCE_NAME}" \
          -e "instance_type=${INSTANCE_TYPE}" \
          -e "ssh_ingress_cidr=${SSH_INGRESS_CIDR}" \
          -e "postgres_db=${POSTGRES_DB}" \
          -e "postgres_user=${POSTGRES_USER}" \
          -e "postgres_password=${POSTGRES_PASSWORD}"
        rc=$?
        set -e

        if [[ "${rc}" -eq 0 ]]; then
          echo -n "Succeeded" > "${STATUS_PATH}"
        else
          echo -n "Failed" > "${STATUS_PATH}"
          exit "${rc}"
        fi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
