apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ec2-postgresql-${{ values.instanceName }}-
  namespace: ${{ values.namespace }}
  labels:
    app.kubernetes.io/part-of: platformcon-wescale
    ec2-postgresql/instance: ${{ values.instanceName }}
spec:
  pipelineRef:
    name: ec2-postgresql
  params:
    - name: ANSIBLE_GIT_URL
      value: ${{ values.ansibleGitUrl }}
    - name: ANSIBLE_GIT_REVISION
      value: ${{ values.ansibleGitRevision }}
    - name: AWS_REGION
      value: ${{ values.awsRegion }}
    - name: VPC_ID
      value: ${{ values.vpcId }}
    - name: SUBNET_ID
      value: ${{ values.subnetId }}
    - name: KEY_NAME
      value: ${{ values.keyName }}
    - name: INSTANCE_NAME
      value: ${{ values.instanceName }}
    - name: INSTANCE_TYPE
      value: ${{ values.instanceType }}
    - name: SSH_INGRESS_CIDR
      value: ${{ values.sshIngressCidr }}
    - name: POSTGRES_DB
      value: ${{ values.postgresDb }}
    - name: POSTGRES_USER
      value: ${{ values.postgresUser }}
    - name: POSTGRES_PASSWORD
      value: ${{ values.postgresPassword }}
    - name: AWS_SECRET
      value: ${{ values.awsSecret }}
    - name: SSH_SECRET
      value: ${{ values.sshSecret }}
