apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{ values.name }}
  description: AWS EC2 + PostgreSQL stack provisioned for ${{ values.name }}
  labels:
    app.kubernetes.io/part-of: platformcon-wescale
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    janus-idp.io/tekton: ${{ values.name }}
    argocd/app-selector: tssc/gitops=${{ values.name }}
    backstage.io/source-location: url:https://${{ values.gitlabHost }}/${{ values.destination }}
    gitlab.com/project-slug: ${{ values.destination }}
spec:
  owner: ${{ values.owner }}
  lifecycle: development
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: Provisioning definition and Pipelines-as-Code triggers for ${{ values.name }}
  labels:
    app.kubernetes.io/part-of: platformcon-wescale
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
    janus-idp.io/tekton: ${{ values.name }}
    argocd/app-selector: tssc/gitops=${{ values.name }}
    backstage.io/source-location: url:https://${{ values.gitlabHost }}/${{ values.destination }}
    gitlab.com/project-slug: ${{ values.destination }}
spec:
  type: service
  owner: ${{ values.owner }}
  lifecycle: development
  system: ${{ values.name }}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.name }}-ec2
  description: "Fedora EC2 ${{ values.name }} (${{ values.instanceType }}) in ${{ values.awsRegion }} — public IP: __EC2_PUBLIC_IP__"
  labels:
    app.kubernetes.io/part-of: platformcon-wescale
  annotations:
    amazon.com/account-region: ${{ values.awsRegion }}
    amazon.com/ec2-instance-type: ${{ values.instanceType }}
    amazon.com/vpc-id: ${{ values.vpcId }}
    amazon.com/subnet-id: ${{ values.subnetId }}
    amazon.com/key-name: ${{ values.keyName }}
    amazon.com/ec2-public-ip: __EC2_PUBLIC_IP__
    amazon.com/ec2-private-ip: __EC2_PRIVATE_IP__
    amazon.com/ec2-instance-id: __EC2_INSTANCE_ID__
  links:
    - url: https://console.aws.amazon.com/ec2/home?region=${{ values.awsRegion }}#InstanceDetails:instanceId=__EC2_INSTANCE_ID__
      title: AWS EC2 Console
      icon: dashboard
    - url: ssh://fedora@__EC2_PUBLIC_IP__
      title: SSH fedora@__EC2_PUBLIC_IP__
      icon: catalog
spec:
  type: compute
  owner: ${{ values.owner }}
  lifecycle: development
  system: ${{ values.name }}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.name }}-db
  description: PostgreSQL database ${{ values.postgresDb }} on ${{ values.name }} (localhost only)
  labels:
    app.kubernetes.io/part-of: platformcon-wescale
  annotations:
    database/engine: postgresql
    database/name: ${{ values.postgresDb }}
    database/user: ${{ values.postgresUser }}
spec:
  type: database
  owner: ${{ values.owner }}
  lifecycle: development
  system: ${{ values.name }}
  dependsOn:
    - resource:default/${{ values.name }}-ec2
